<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBSERVATIONS — RYUSEI ETO</title>
<meta name="description" content="衛藤隆世のシミュレーション作品集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash" class="splash" aria-hidden="true">
  <span class="splash-text">OBSERVATIONS</span>
</div>

<main>
  <header class="page-header">
    <div class="page-header-left">
      <span>LOG</span>
      <span>RYUSEI ETO</span>
    </div>
    <div class="page-header-right">
      <span class="page-clock" id="pageClock"></span>
      <span class="page-coords" id="pageCoords">0000 0000</span>
    </div>
  </header>

  <div id="ledger" class="ledger"></div>
</main>

<footer class="site-footer">
  <a href="https://www.instagram.com/sightseeingcomputer/" target="_blank" rel="noopener">@sightseeingcomputer</a>
</footer>

<div id="tapCrosshair" class="tap-crosshair" aria-hidden="true"></div>

<div id="viewer" class="viewer" aria-hidden="true">
  <button class="viewer-close" aria-label="閉じる">×</button>
  <div class="viewer-inner">
    <div class="viewer-image-wrap">
      <img id="viewer-image" src="" alt="">
    </div>
    <div class="viewer-meta">
      <span class="viewer-index" id="viewer-index"></span>
      <h2 id="viewer-title"></h2>
      <dl class="viewer-fields">
        <dt>ROAD</dt><dd id="viewer-road"></dd>
        <dt>LOCATION</dt><dd id="viewer-location"></dd>
        <dt>OBSERVED</dt><dd id="viewer-observed"></dd>
        <dt>GENERATED</dt><dd id="viewer-generated"></dd>
      </dl>
      <p id="viewer-note"></p>
    </div>
  </div>
</div>

<script src="works.js"></script>
<script src="script.js"></script>
</body>
</html>
